; Kali-inspired highlight theme for fast-syntax-highlighting
; Based on the default Kali Linux .zshrc highlight styles

[base]
default                          = none
unknown-token                    = underline
commandseparator                 = blue,bold
redirection                      = blue,bold
here-string-tri                  = yellow
here-string-text                 = bg:19
comment                          = black,bold

[command-point]
reserved-word                    = cyan,bold
alias                            = green
suffix-alias                     = green,underline
global-alias                     = green,bold
builtin                          = green
function                         = green
command                          = green
precommand                       = green,underline

[paths]
path                             = bold
pathseparator                    = none
globbing                         = blue,bold
globbing-ext                     = blue,bold

[brackets]
paired-bracket                   = standout
bracket-level-1                  = blue,bold
bracket-level-2                  = green,bold
bracket-level-3                  = magenta,bold

[arguments]
single-hyphen-option             = green
double-hyphen-option             = green
single-quoted-argument           = yellow
double-quoted-argument           = yellow
dollar-quoted-argument           = yellow

[in-string]
back-quoted-argument-delimiter   = blue,bold
back-dollar-quoted-argument      = magenta,bold
back-or-dollar-double-quoted-argument = magenta,bold

[other]
variable                         = none
assign                           = none
history-expansion                = blue,bold

[math]
mathvar                          = blue,bold
mathnum                          = magenta
matherr                          = red
