# modified from Tokyo Night preset
format = """
[ $os $env_var$hostname](bg:#a3aed2 fg:#090c0c)\
[](bg:#769ff0 fg:#a3aed2)\
$gcloud\
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$nodejs\
$rust\
$golang\
$php\
$python\
[](fg:#212736)"""

[os]
disabled = false
format = "$symbol"

[os.symbols]
Arch = ""
CachyOS = ""
Macos = ""
Ubuntu = ""
Kali = ""
Windows = ""

[hostname]
ssh_symbol = "🌐"
ssh_only = false
format = "$ssh_symbol"
style = "bg:#a3aed2 fg:#090c0c"

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"dev" = " "

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[php]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[python]
symbol = ""
style = "bg:#212736"
pyenv_version_name = true
format = '[[ $symbol $virtualenv ($version) ](fg:#769ff0 bg:#212736)]($style)'

[time]
disabled = false
time_format = "%T" # Hour:Minute Format
# style = "fg:#e3e5e5"
style = "fg:#e3e5e5 bg:#769ff0"
format = '[  $time ]($style)'

[gcloud]
symbol = "󱇶"
style = "fg:#e3e5e5 bg:#769ff0"
format = '[ $symbol $domain (\($region\))]($style)'
disabled = true

[kubernetes]
style = "fg:#e3e5e5 bg:#769ff0"
format = '[ $symbol$context( \($namespace\))]($style)'
disabled = false

[env_var.STARSHIP_STATUS]
default = ''
# style = "fg:#e3e5e5 bg:#769ff0"
format = '$env_value'
